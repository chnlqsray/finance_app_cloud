name: Repo Keepalive

on:
  schedule:
    # 每隔2个月的1号 UTC 9:00 自动提交一次，防止仓库因60天无活动被禁用
    - cron: '0 9 1 * *'
  workflow_dispatch:  # 保留手动触发，方便立即测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 必须授权，否则 git push 会失败

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 写入时间戳并提交
        run: |
          echo "Last keepalive: $(date -u)" > last_active.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_active.txt
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
